[project]
name = "risk-engine"
version = "0.1.0"
description = "Portfolio Risk & Stress-Testing Engine"
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg2-binary>=2.9",
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.13",
    "yfinance>=0.2.40",
    "jinja2>=3.1",
    "matplotlib>=3.8",
    "requests>=2.31",
    "python-dateutil>=2.9",
    "pandas-market-calendars>=4.4",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-requests",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "integration: requires a live Postgres database",
    "e2e: full workflow through the API layer",
    "slow: slower statistical/convergence tests",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# FastAPI's `Depends(...)` as an argument default is the framework-documented, idiomatic pattern
# -- not the mutable-default-argument footgun B008 exists to catch.
"src/risk_engine/api/routers/*.py" = ["B008"]

[tool.mypy]
python_version = "3.10"
mypy_path = "src"
explicit_package_bases = true
ignore_missing_imports = true
warn_unused_ignores = true
disallow_untyped_defs = false
