# docker compose up --build
#
# Services:
#   db         PostgreSQL 17, persisted to a named volume.
#   migrate    Runs Alembic migrations once, then exits (api/scheduler depend_on it completing).
#   api        FastAPI app + dashboard (served at /dashboard), port 8000.
#   scheduler  Runs the daily pipeline once at container start, then on a loop every 24h.
#              (Documented as a container-internal loop rather than host cron -- see
#              docs/DEPLOYMENT.md for the equivalent real-cron setup.)
#
# Not run/validated in this dev sandbox -- no Docker available (see CLAUDE.md). Written to the
# same standard as the rest of the codebase; flagged honestly rather than claimed as tested.

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: risk_engine
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: portfolio_risk_engine
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U risk_engine -d portfolio_risk_engine"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://risk_engine:${POSTGRES_PASSWORD}@db:5432/portfolio_risk_engine
    command: ["python", "-m", "alembic", "upgrade", "head"]

  api:
    build: .
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql+psycopg2://risk_engine:${POSTGRES_PASSWORD}@db:5432/portfolio_risk_engine
      API_KEY: ${API_KEY:?set API_KEY in .env}
      MC_DEFAULT_SEED: ${MC_DEFAULT_SEED:-42}
      DATA_SOURCE: ${DATA_SOURCE:-yfinance}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ENVIRONMENT: production
    ports:
      - "8000:8000"

  scheduler:
    build: .
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql+psycopg2://risk_engine:${POSTGRES_PASSWORD}@db:5432/portfolio_risk_engine
      API_KEY: ${API_KEY:?set API_KEY in .env}
      MC_DEFAULT_SEED: ${MC_DEFAULT_SEED:-42}
      DATA_SOURCE: ${DATA_SOURCE:-yfinance}
    entrypoint: ["sh", "-c"]
    command:
      - |
        while true; do
          python -m risk_engine.scheduler.run_daily_pipeline
          sleep 86400
        done

volumes:
  pgdata:
